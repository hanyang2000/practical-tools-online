<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理后台｜策划实用小工具</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#182230;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}.top{height:64px;background:#15243a;color:#fff;display:flex;align-items:center;padding:0 28px;justify-content:space-between}.top h1{font-size:19px;font-weight:600;margin:0}.top button,.card button{border:0;border-radius:7px;padding:9px 14px;background:#2274e5;color:#fff;cursor:pointer}.top button{background:#31445f}.wrap{max-width:1180px;margin:24px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid #e0e5ec;border-radius:11px;padding:18px;box-shadow:0 2px 10px #15243a0b}.card h2{font-size:16px;margin:0 0 14px}.muted{color:#718096;font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.row input,.row select{border:1px solid #ccd5e1;border-radius:6px;padding:8px;min-width:160px}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat div{background:#f5f8fc;border-radius:8px;padding:11px}.stat strong{display:block;font-size:18px;margin-top:3px}.wide{grid-column:1/-1}.log{white-space:pre-wrap;background:#101827;color:#d6e3f5;border-radius:7px;padding:12px;font-size:12px;max-height:220px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:8px;border-bottom:1px solid #edf0f4}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head>
<body><header class="top"><h1>策划实用小工具 · 管理后台</h1><button id="logout">退出登录</button></header>
<main class="wrap"><div class="grid">
<section class="card"><h2>中心状态</h2><div id="status" class="stat"></div><p id="storageSummary" class="muted"></p><button id="refresh">刷新状态</button></section>
<section class="card"><h2>Agent 配对</h2><p class="muted">配对码 10 分钟内有效且只能使用一次，不会显示 Agent 密钥。</p><div class="row"><button id="pair">生成配对码</button><strong id="pairCode"></strong></div><div id="agents"></div></section>
<section class="card"><h2>截图存储 / 腾讯云 COS</h2><div class="row"><select id="backend"><option value="local">本地存储</option><option value="tencent_cos">腾讯云 COS</option></select><input id="bucket" placeholder="Bucket"><input id="region" placeholder="地域，如 ap-shanghai"></div><div class="row"><input id="prefix" placeholder="对象前缀"><input id="secretId" placeholder="SecretId（留空保持不变）"><input id="secretKey" type="password" placeholder="SecretKey（留空保持不变）"></div><div class="row"><button id="saveStorage">保存配置</button><button id="testStorage">测试连接</button><span id="storageResult" class="muted"></span></div></section>
<section class="card"><h2>在线更新</h2><p id="updateStatus" class="muted"></p><div class="row"><input type="file" id="updateFile" accept=".zip"><input id="updateSha" placeholder="可选 SHA-256"><button id="uploadUpdate">上传并暂存</button><button id="installUpdate">安装待更新</button><button id="rollback">生成回滚标记</button></div></section>
<section class="card wide"><h2>中心迁移</h2><p class="muted">导出当前中心的完整程序、业务数据和本地素材。已有 Agent 的绑定身份会保留；密钥、Cookie、会话和日志不会进入压缩包。导出包请按备份妥善保管。</p><div class="row"><button id="exportCenter" onclick="window.location.href='/api/admin/migration/center/export'">导出完整中心迁移包</button><span id="centerExportResult" class="muted">换中心主机且域名不变时，可直接使用此包恢复。</span></div></section><section class="card wide"><h2>历史数据迁移</h2><div class="row"><input type="file" id="bundle" accept=".ptmigration.zip,.zip"><select id="owner"></select><button id="importBundle">上传迁移包</button><button id="scanTasks">刷新任务</button></div><div id="tasks"></div></section><section class="card wide"><h2>本工具账号</h2><div class="row"><input id="accountName" placeholder="新账号"><input id="accountPassword" type="password" placeholder="密码（至少10位）"><select id="accountRole"><option value="planner">普通账号</option><option value="admin">管理员</option></select><button id="accountCreate">新建账号</button></div><div id="accounts"></div></section>
<section class="card wide"><h2>操作日志</h2><div id="log" class="log">就绪</div></section>
</div></main>
<script>
const $=id=>document.getElementById(id);const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const api=async(path,opt={})=>{const r=await fetch('/api/admin'+path,{credentials:'same-origin',...opt});const d=await r.json().catch(()=>({error:r.statusText}));if(!r.ok)throw Error(d.detail||d.error||'请求失败');return d};const log=x=>{$('log').textContent=new Date().toLocaleString()+'\n'+(typeof x==='string'?x:JSON.stringify(x,null,2))};
async function accounts(){const d=await api('/accounts');$('accounts').innerHTML=d.accounts.map(a=>'<div class="row"><strong>'+esc(a.username)+'</strong><span class="muted">'+esc(a.role)+' · '+(a.active?'启用':'停用')+'</span><button data-toggle="'+esc(a.id)+'">'+(a.active?'停用':'启用')+'</button><button data-pass="'+esc(a.id)+'">改密码</button><button data-del="'+esc(a.id)+'">删除</button></div>').join('')||'<p class="muted">暂无账号</p>';document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const a=d.accounts.find(x=>x.id===b.dataset.toggle);try{await api('/accounts/'+a.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:!a.active})});accounts()}catch(e){log(e.message)}});document.querySelectorAll('[data-pass]').forEach(b=>b.onclick=async()=>{const p=prompt('请输入新密码（至少10位）');if(p)try{await api('/accounts/'+b.dataset.pass,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});log('密码已更新')}catch(e){log(e.message)}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('确认删除该账号？'))try{await api('/accounts/'+b.dataset.del,{method:'DELETE'});accounts()}catch(e){log(e.message)}})}
async function refresh(){try{const d=await api('/status');$('status').innerHTML='<div>版本<strong>'+d.version+'</strong></div><div>端口<strong>'+d.port+'</strong></div><div>Agent<strong>'+d.agents.length+'</strong></div>';$('storageSummary').textContent='存储：'+d.storage.backend+(d.storage.backend==='tencent_cos'?' · '+d.storage.bucket+' / '+d.storage.region:'');const ustate=d.updates.last_result;let updateText='当前版本 '+d.updates.current_version+'；远程检查'+(d.updates.remote_enabled?'已开启':'默认关闭');if(d.updates.pending)updateText+='；已有待重启更新';if(ustate)updateText+='；上次结果：'+(ustate.ok?'更新成功':(ustate.status==='rolled_back'?'已回滚':'更新失败'))+(ustate.error?'（'+ustate.error+'）':'');$('updateStatus').textContent=updateText;$('agents').innerHTML=d.agents.map(a=>'<p class="muted">'+(a.name||a.device_id)+' · '+a.platform+' · '+a.status+' · '+(a.last_seen_at||'未连接')+'</p>').join('')||'<p class="muted">暂无 Agent</p>';const s=await api('/settings/storage');$('backend').value=s.storage.backend;$('bucket').value=s.storage.bucket;$('region').value=s.storage.region;$('prefix').value=s.storage.prefix;const u=await api('/users');$('owner').innerHTML=u.users.map(x=>'<option value="'+x.id+'">'+x.display_name+'（'+x.username+'）</option>').join('');await tasks();}catch(e){log(e.message)}}
async function tasks(){const d=await api('/migration/tasks');$('tasks').innerHTML=d.tasks.map(t=>'<p>'+t.filename+' · '+t.status+' · '+(t.report.result?'已完成':'待处理')+(t.status==='uploaded'?' <button data-start="'+t.id+'">开始迁移</button>':'')+(t.status!=='running'?' <button data-delete="'+t.id+'">清除</button>':'')+'</p>').join('')||'<p class="muted">暂无迁移任务</p>';document.querySelectorAll('[data-start]').forEach(b=>b.onclick=async()=>{try{log(await api('/migration/tasks/'+b.dataset.start+'/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({owner_id:$('owner').value})}));await tasks()}catch(e){log(e.message)}});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('确认清除这个迁移包及任务记录？'))return;try{log(await api('/migration/tasks/'+b.dataset.delete,{method:'DELETE'}));await tasks()}catch(e){log(e.message)}})}
$('refresh').onclick=refresh;$('scanTasks').onclick=tasks;$('pair').onclick=async()=>{try{const d=await api('/pair-code',{method:'POST'});$('pairCode').textContent=d.code;log(d)}catch(e){log(e.message)}};$('saveStorage').onclick=async()=>{try{log(await api('/settings/storage',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({backend:$('backend').value,bucket:$('bucket').value,region:$('region').value,prefix:$('prefix').value,secret_id:$('secretId').value,secret_key:$('secretKey').value})}));$('storageResult').textContent='已保存'}catch(e){$('storageResult').textContent=e.message}};$('testStorage').onclick=async()=>{try{log(await api('/settings/storage/test',{method:'POST'}));$('storageResult').textContent='连接成功'}catch(e){$('storageResult').textContent=e.message}};$('importBundle').onclick=async()=>{try{if(!$('bundle').files[0])throw Error('请选择 .ptmigration.zip');const f=new FormData();f.append('file',$('bundle').files[0]);log(await api('/migration/bundles/import',{method:'POST',body:f}));await tasks()}catch(e){log(e.message)}};$('uploadUpdate').onclick=async()=>{try{if(!$('updateFile').files[0])throw Error('请选择更新包');const f=new FormData();f.append('file',$('updateFile').files[0]);if($('updateSha').value)f.append('sha256',$('updateSha').value);log(await api('/updates/upload',{method:'POST',body:f}));await refresh()}catch(e){log(e.message)}};$('installUpdate').onclick=async()=>{try{log(await api('/updates/install',{method:'POST'}))}catch(e){log(e.message)}};$('rollback').onclick=async()=>{try{log(await api('/updates/rollback',{method:'POST'}))}catch(e){log(e.message)}};$('logout').onclick=()=>fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'}).then(()=>location.href='/');refresh();
async function cosAdminUpload(file,purpose){const b=await file.arrayBuffer(), h=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),x=>x.toString(16).padStart(2,'0')).join('');const i=await (await fetch('/api/auth/uploads/initiate?'+new URLSearchParams({purpose,filename:file.name,size:file.size,sha256:h}),{method:'POST'})).json();if(!i.upload_url)throw Error(i.detail||'COS初始化失败');const p=await fetch(i.upload_url,{method:'PUT',headers:i.upload_headers||{},body:file});if(!p.ok)throw Error('COS上传失败');const c=await (await fetch('/api/auth/uploads/'+i.upload_id+'/complete',{method:'POST'})).json();if(!c.ok)throw Error(c.detail||'COS校验失败');return i.upload_id}
const oldImport=$('importBundle').onclick; $('importBundle').onclick=async()=>{const f=$('bundle').files[0];const useCos=f&&($('backend').value==='tencent_cos'||f.size>1024*1024);if(useCos){try{const id=await cosAdminUpload(f,'migration_bundle');log(await api('/migration/from-cos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({upload_id:id})}));await tasks()}catch(e){log(e.message)}return}oldImport()};
const oldUpdate=$('uploadUpdate').onclick; $('uploadUpdate').onclick=async()=>{const f=$('updateFile').files[0];const useCos=f&&($('backend').value==='tencent_cos'||f.size>1024*1024);if(useCos){try{const id=await cosAdminUpload(f,'update_bundle');log(await api('/updates/from-cos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({upload_id:id})}));await refresh()}catch(e){log(e.message)}return}oldUpdate()};
document.getElementById('accountCreate').onclick=async()=>{try{await api('/accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('accountName').value,password:$('accountPassword').value,role:$('accountRole').value})});$('accountName').value='';$('accountPassword').value='';await accounts()}catch(e){log(e.message)}};accounts();
</script></body></html>
